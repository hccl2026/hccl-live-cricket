/* =========================================================
   PAGE
========================================================= */

.profile-page{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
  padding:55px 0 90px;
}

.player-profile-hero{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:38px;
  align-items:center;

  padding:38px;

  border:1px solid rgba(54,101,145,.70);
  border-radius:26px;

  background:
    radial-gradient(circle at 10% 35%,rgba(28,91,150,.19),transparent 34%),
    radial-gradient(circle at 90% 40%,rgba(239,27,27,.13),transparent 36%),
    linear-gradient(
      110deg,
      rgba(7,26,52,.90),
      rgba(2,5,9,.96) 53%,
      rgba(29,5,8,.88)
    );
}


/* =========================================================
   HUMAN AVATAR
========================================================= */

.profile-visual{
  text-align:center;
}

.human-avatar{
  --skin:#d99468;
  --skin2:#b96f48;
  --hair:#241512;
  --hair2:#0e0908;
  --shirt:#151a22;

  width:220px;
  height:220px;

  margin:auto;

  position:relative;
  overflow:hidden;

  border-radius:50%;

  border:3px solid #315f89;

  background:
    radial-gradient(
      circle at 50% 28%,
      #153f69 0%,
      #081c31 55%,
      #03080e 100%
    );

  box-shadow:
    0 0 28px rgba(41,105,168,.25),
    0 20px 45px rgba(0,0,0,.28);
}


/* BODY */

.avatar-body{
  position:absolute;
  width:164px;
  height:93px;

  left:50%;
  bottom:-28px;

  transform:translateX(-50%);

  border-radius:52% 52% 0 0;

  background:var(--shirt);

  z-index:1;
}


/* NECK */

.avatar-neck{
  position:absolute;

  width:43px;
  height:56px;

  left:50%;
  bottom:43px;

  transform:translateX(-50%);

  background:
    linear-gradient(
      90deg,
      var(--skin2),
      var(--skin) 50%,
      var(--skin2)
    );

  border-radius:11px;

  z-index:2;
}


/* EARS */

.avatar-ear{
  position:absolute;

  width:21px;
  height:38px;

  top:90px;

  border-radius:50%;

  background:var(--skin);

  z-index:3;
}

.avatar-ear.left{
  left:46px;
}

.avatar-ear.right{
  right:46px;
}


/* FACE */

.avatar-face{
  position:absolute;

  width:108px;
  height:132px;

  left:50%;
  top:44px;

  transform:translateX(-50%);

  border-radius:
    48% 48% 45% 45% /
    42% 42% 58% 58%;

  background:
    linear-gradient(
      90deg,
      var(--skin2),
      var(--skin) 47%,
      #e8aa7f
    );

  z-index:4;
}


/* EYEBROWS */

.eyebrow{
  position:absolute;

  width:27px;
  height:4px;

  top:43px;

  border-radius:7px;

  background:var(--hair2);
}

.eyebrow.left{
  left:18px;
  transform:rotate(-6deg);
}

.eyebrow.right{
  right:18px;
  transform:rotate(6deg);
}


/* EYES */

.eye{
  position:absolute;

  width:15px;
  height:9px;

  top:54px;

  border-radius:50%;

  background:#fff;
}

.eye.left{
  left:25px;
}

.eye.right{
  right:25px;
}

.eye:after{
  content:"";

  position:absolute;

  width:6px;
  height:6px;

  left:4px;
  top:1.5px;

  border-radius:50%;

  background:#21130e;
}


/* NOSE */

.avatar-nose{
  position:absolute;

  width:11px;
  height:28px;

  left:50%;
  top:62px;

  transform:translateX(-50%);

  border-right:2px solid rgba(92,48,32,.32);
  border-bottom:2px solid rgba(92,48,32,.32);

  border-radius:0 0 8px 0;
}


/* MOUTH */

.avatar-mouth{
  position:absolute;

  width:27px;
  height:8px;

  left:50%;
  top:99px;

  transform:translateX(-50%);

  border-bottom:3px solid #84483d;

  border-radius:50%;
}


/* HAIR */

.avatar-hair{
  position:absolute;

  width:122px;
  height:62px;

  top:27px;
  left:50%;

  transform:translateX(-50%);

  background:
    linear-gradient(
      145deg,
      var(--hair2),
      var(--hair) 55%,
      var(--hair2)
    );

  border-radius:58% 47% 27% 30%;

  z-index:8;
}


/* BEARD */

.avatar-beard{
  display:none;

  position:absolute;

  width:88px;
  height:62px;

  left:50%;
  top:94px;

  transform:translateX(-50%);

  background:
    linear-gradient(
      145deg,
      var(--hair2),
      var(--hair),
      var(--hair2)
    );

  clip-path:
    polygon(
      4% 0,
      96% 0,
      87% 62%,
      67% 87%,
      50% 100%,
      33% 87%,
      13% 62%
    );

  z-index:7;
}


/* MOUSTACHE */

.avatar-moustache{
  display:none;

  position:absolute;

  width:48px;
  height:12px;

  left:50%;
  top:91px;

  transform:translateX(-50%);

  background:var(--hair2);

  border-radius:50% 50% 35% 35%;

  z-index:8;
}


/* FEMALE LONG HAIR */

.avatar-long-hair{
  display:none;

  position:absolute;

  width:145px;
  height:155px;

  top:28px;
  left:50%;

  transform:translateX(-50%);

  border-radius:55% 55% 42% 42%;

  background:
    linear-gradient(
      90deg,
      var(--hair2),
      var(--hair),
      var(--hair2)
    );

  z-index:2;
}


/* PONY */

.avatar-pony{
  display:none;

  position:absolute;

  width:47px;
  height:78px;

  right:35px;
  top:62px;

  border-radius:60% 45% 70% 40%;

  background:var(--hair);

  transform:rotate(-15deg);

  z-index:2;
}


/* BUN */

.avatar-bun{
  display:none;

  position:absolute;

  width:52px;
  height:52px;

  top:16px;
  right:44px;

  border-radius:50%;

  background:var(--hair);

  z-index:4;
}


/* COLLAR */

.avatar-collar{
  position:absolute;

  width:76px;
  height:28px;

  bottom:22px;
  left:50%;

  transform:translateX(-50%);

  border-top:4px solid #ef1b1b;

  border-radius:50%;

  z-index:5;
}

/* =========================================================
   REAL PARTIAL STAR RATING
========================================================= */

.rating-wrap{
  margin-top:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:9px;
}


/* 5 EMPTY STARS */

.star-meter{
  position:relative;

  display:inline-block;

  font-size:24px;
  line-height:1;

  letter-spacing:2px;

  white-space:nowrap;
}


/* BACKGROUND EMPTY STARS */

.star-meter::before{
  content:"★★★★★";

  color:#26323f;
}


/* FILLED STARS OVERLAY */

.star-fill{
  position:absolute;

  left:0;
  top:0;

  width:0%;

  overflow:hidden;

  white-space:nowrap;

  pointer-events:none;
}


/* SAME 5 STARS INSIDE FILL */

.star-fill::before{
  content:"★★★★★";
}


/* RATING NUMBER */

.rating-number{
  color:#fff;

  font-size:14px;
  font-weight:1000;
}


/* COLOR LEVELS */

.rating-gold .star-fill{
  color:#ffe14b;

  text-shadow:
    0 0 8px rgba(255,225,75,.30);
}

.rating-green .star-fill{
  color:#58dc78;

  text-shadow:
    0 0 7px rgba(88,220,120,.20);
}

.rating-yellow .star-fill{
  color:#dce447;
}

.rating-orange .star-fill{
  color:#ff9f2e;
}

.rating-red .star-fill{
  color:#ff4b4b;
}


/* =========================================================
   ROLE
========================================================= */

.avatar-role{
  margin-top:10px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:7px 14px;

  border:1px solid #294c70;
  border-radius:999px;

  background:#061323;

  font-size:10px;
  font-weight:1000;
}

.role-symbol{
  font-size:18px;
}


/* =========================================================
   PROFILE DETAILS
========================================================= */

.profile-kicker{
  color:#ef1b1b;

  font-size:10px;
  font-weight:1000;

  letter-spacing:2px;
}

.profile-info h1{
  margin:7px 0;

  font-size:clamp(40px,5vw,62px);

  line-height:1;
}

.player-location{
  color:#98a4b1;

  font-size:13px;
}

.profile-badges{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.profile-badge{
  padding:8px 12px;

  border:1px solid #294762;
  border-radius:999px;

  background:#071525;

  font-size:10px;
  font-weight:900;
}

.profile-badge.verified{
  color:#51db82;
  border-color:#256b43;
}

.profile-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;

  margin-top:20px;
}

.profile-btn{
  min-height:42px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:0 16px;

  border-radius:9px;

  background:#ef1b1b;

  font-size:10px;
  font-weight:1000;
}

.profile-btn.alt{
  background:#07182c;

  border:1px solid #31577e;
}


/* =========================================================
   SUMMARY / STATS
========================================================= */

.profile-summary{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:12px;

  margin-top:22px;
}

.summary-box,
.stat-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(7,24,44,.94),
      rgba(5,7,11,.94)
    );
}

.summary-box small,
.stat-card small{
  display:block;

  color:#84909d;

  font-size:9px;
  font-weight:900;
}

.summary-box strong,
.stat-card strong{
  display:block;

  margin-top:6px;

  font-size:21px;
}

.profile-section{
  margin-top:35px;
}

.section-title span{
  color:#ef1b1b;

  font-size:9px;
  font-weight:1000;

  letter-spacing:1.5px;
}

.section-title h2{
  margin:4px 0 14px;

  font-size:25px;
}

.stats-grid{
  display:grid;

  grid-template-columns:repeat(5,1fr);

  gap:12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .player-profile-hero{
    grid-template-columns:1fr;

    text-align:center;
  }

  .profile-badges,
  .profile-actions{
    justify-content:center;
  }

  .profile-summary{
    grid-template-columns:repeat(2,1fr);
  }

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:600px){

  .human-avatar{
    width:190px;
    height:190px;
  }

  .star-meter{
    font-size:21px;
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

/* =========================================================
   SCORE → EXACT RATING

   100 score = 5.00
   94 score = 4.70
   67 score = 3.35

   This allows true partial star fills.
========================================================= */

function getRating(score){

  let result =
    (score / 100) * 5;

  result =
    Math.max(
      0,
      Math.min(5,result)
    );

  return Math.round(
    result * 100
  ) / 100;

}


/* =========================================================
   STAR FILL %
========================================================= */

function getFillPercentage(rating){

  return(
    rating / 5
  ) * 100;

}


/* =========================================================
   COLOR
========================================================= */

function ratingClass(rating){

  if(rating >= 4.5){
    return "rating-gold";
  }

  if(rating >= 3.5){
    return "rating-green";
  }

  if(rating >= 3){
    return "rating-yellow";
  }

  if(rating >= 2.5){
    return "rating-orange";
  }

  return "rating-red";

}


/* =========================================================
   BASE POINTS
========================================================= */

function basePoints(rating){

  if(rating >= 4.5){
    return 50;
  }

  if(rating >= 3.5){
    return 25;
  }

  return 10;

}


/* =========================================================
   ROLE
========================================================= */

function roleData(role){

  const r =
    role.toLowerCase();


  if(r.includes("keeper")){

    return{
      symbol:"🧤 🏏",
      title:"WICKET KEEPER"
    };

  }


  if(r.includes("all-rounder")){

    return{
      symbol:"🏏 🔴",
      title:"ALL-ROUNDER"
    };

  }


  if(r.includes("spin")){

    return{
      symbol:"🔴 🌀",
      title:"SPIN BOWLER"
    };

  }


  if(r.includes("fast")){

    return{
      symbol:"🔴 ⚡",
      title:"FAST BOWLER"
    };

  }


  if(
    r.includes("medium") ||
    r.includes("pacer")
  ){

    return{
      symbol:"🔴 🎯",
      title:"MEDIUM PACER"
    };

  }


  return{
    symbol:"🏏",
    title:"BATSMAN"
  };

}


/* =========================================================
   AVATAR CLASS
========================================================= */

function avatarClass(player){

  if(
    player.gender
    .toLowerCase() === "female"
  ){

    const number =
      9 +
      ((player.id - 1) % 8);

    return(
      "female v" +
      number
    );

  }


  const number =
    1 +
    ((player.id - 1) % 8);


  return(
    "male v" +
    number
  );

}

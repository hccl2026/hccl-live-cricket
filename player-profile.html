<style>

/* ===============================
   PLAYER PROFILE PAGE
================================ */

.profile-page{
  width:min(1200px,calc(100% - 32px));
  margin:auto;
  padding:55px 0 90px;
}


/* HERO */

.player-hero{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:260px 1fr;
  gap:30px;
  align-items:center;

  padding:30px;

  border:1px solid #203b59;
  border-radius:22px;

  background:
  linear-gradient(
    115deg,
    #071b36 0%,
    #03070c 50%,
    #160507 75%,
    #500707 100%
  );
}

.player-hero:after{
  content:"";
  position:absolute;

  width:350px;
  height:350px;

  right:-100px;
  top:-120px;

  border-radius:50%;

  background:
  radial-gradient(
    circle,
    rgba(239,27,27,.20),
    transparent 70%
  );

  pointer-events:none;
}


/* PLAYER PHOTO */

.player-photo-box{
  position:relative;
  z-index:2;

  display:flex;
  justify-content:center;
}

.player-photo{
  width:230px;
  height:230px;

  object-fit:cover;

  border-radius:22px;

  border:2px solid #345a80;

  background:#071323;

  box-shadow:
  0 15px 40px rgba(0,0,0,.45);
}


/* HERO INFO */

.player-info{
  position:relative;
  z-index:2;
}

.player-kicker{
  color:#ff2424;

  font-size:11px;
  font-weight:1000;

  letter-spacing:2px;
}

.player-info h1{
  margin:7px 0 5px;

  color:#fff;

  font-size:clamp(38px,5vw,60px);

  line-height:1;
}

.player-location{
  color:#a8b1bc;

  font-size:14px;

  margin-bottom:18px;
}


/* BADGES */

.player-badges{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.player-badge{
  padding:8px 12px;

  border:1px solid #294563;
  border-radius:999px;

  background:#071323;

  color:#fff;

  font-size:10px;
  font-weight:1000;
}

.grade-a{
  color:#ffd44e;
  border-color:#8b741d;
}

.grade-b{
  color:#75b9ff;
  border-color:#35628f;
}

.grade-c{
  color:#d1d5da;
}

.verified{
  color:#43d17c;
  border-color:#27794a;
}


/* BUTTONS */

.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin-top:20px;
}

.profile-button{
  display:inline-flex;
  justify-content:center;
  align-items:center;

  min-height:43px;

  padding:0 17px;

  border-radius:9px;

  background:#ed1616;

  color:#fff;

  text-decoration:none;

  font-size:11px;
  font-weight:1000;
}

.profile-button:hover{
  background:#ff2929;
}

.profile-button.secondary{
  background:#07182c;

  border:1px solid #31577e;
}


/* MAIN SCORE CARDS */

.profile-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;

  margin-top:22px;
}

.summary-box{
  padding:19px;

  border:1px solid #203b59;
  border-radius:14px;

  background:
  linear-gradient(
    145deg,
    #07182c,
    #05070b
  );
}

.summary-box small{
  display:block;

  color:#8794a2;

  font-size:10px;
  font-weight:900;
}

.summary-box strong{
  display:block;

  margin-top:6px;

  color:#fff;

  font-size:25px;
}

.summary-box.red strong{
  color:#ff3434;
}

.summary-box.gold strong{
  color:#ffd34d;
}


/* SECTIONS */

.profile-section{
  margin-top:34px;
}

.section-heading{
  margin-bottom:14px;
}

.section-heading span{
  display:block;

  color:#ef1b1b;

  font-size:10px;
  font-weight:1000;

  letter-spacing:1.5px;
}

.section-heading h2{
  margin-top:4px;

  color:#fff;

  font-size:25px;
}


/* INFO GRID */

.info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.info-card{
  padding:16px;

  border:1px solid #203850;
  border-radius:12px;

  background:#071323;
}

.info-card small{
  display:block;

  color:#84909d;

  font-size:9px;
  font-weight:900;
}

.info-card strong{
  display:block;

  margin-top:6px;

  color:#fff;

  font-size:14px;
}


/* STAT GRID */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.stat-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:
  linear-gradient(
    145deg,
    #07182c,
    #05070b
  );
}

.stat-card small{
  display:block;

  color:#85919e;

  font-size:9px;
  font-weight:1000;
}

.stat-card strong{
  display:block;

  margin-top:6px;

  color:#fff;

  font-size:22px;
}


/* BATTING */

.batting-section .stat-card strong{
  color:#fff;
}


/* BOWLING */

.bowling-section .stat-card:nth-child(1) strong{
  color:#ff4040;
}


/* FIELDING */

.fielding-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}


/* VERIFICATION */

.verification-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.verification-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:#071323;
}

.verification-card small{
  display:block;

  color:#85919e;

  font-size:9px;
  font-weight:1000;
}

.verification-card strong{
  display:block;

  margin-top:7px;

  color:#ffca45;
}

.verification-card.success{
  border-color:#23613f;
}

.verification-card.success strong{
  color:#43d17c;
}


/* NOT FOUND */

.player-not-found{
  padding:100px 20px;

  text-align:center;
}

.player-not-found h1{
  color:#fff;
  font-size:40px;
}

.player-not-found p{
  margin:10px 0 20px;

  color:#929da8;
}


/* MOBILE */

@media(max-width:1000px){

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:800px){

  .player-hero{
    grid-template-columns:1fr;

    text-align:center;
  }

  .player-badges,
  .player-actions{
    justify-content:center;
  }

  .profile-summary{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .stats-grid,
  .fielding-grid,
  .verification-grid,
  .info-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:430px){

  .profile-summary,
  .stats-grid,
  .fielding-grid,
  .verification-grid,
  .info-grid{
    grid-template-columns:1fr;
  }

  .player-photo{

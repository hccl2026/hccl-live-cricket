<title>HCCL — Player Profile</title>

<link rel="stylesheet" href="site.css">

<style>

.profile-page{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:60px 0 90px;
}

.profile-hero{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:28px;
  align-items:center;

  padding:26px;

  border:1px solid #213b59;
  border-radius:20px;

  background:
  linear-gradient(
    145deg,
    #071a34 0%,
    #05070b 58%,
    #190507 100%
  );
}

.player-photo-large{
  width:220px;
  height:220px;
  border-radius:20px;
  object-fit:cover;

  border:2px solid #31577e;

  background:#071323;
}

.profile-main small{
  color:#ef1b1b;
  font-weight:900;
  letter-spacing:1.5px;
}

.profile-main h1{
  margin:6px 0 6px;
  font-size:clamp(34px,5vw,54px);
}

.profile-sub{
  color:#9ea7b2;
  margin-bottom:18px;
}

.profile-badges{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.badge{
  padding:8px 12px;
  border-radius:999px;

  background:#071323;
  border:1px solid #29415e;

  font-size:11px;
  font-weight:900;
}

.grade-a{
  color:#ffd34d;
  border-color:#8d741d;
}

.grade-b{
  color:#79baff;
  border-color:#315f8f;
}

.grade-c{
  color:#c7ccd2;
}

.verify{
  color:#44d47d;
  border-color:#2e8151;
}

.profile-actions{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.action-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:42px;
  padding:0 15px;

  border-radius:9px;

  background:#ef1b1b;
  color:#fff;

  font-size:12px;
  font-weight:900;
}

.action-btn.secondary{
  background:#07182c;
  border:1px solid #31577e;
}


/* SUMMARY */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:22px;
}

.summary-card{
  padding:18px;
  border:1px solid #203a58;
  border-radius:14px;
  background:#071323;
}

.summary-card small{
  color:#8995a3;
  font-size:10px;
  font-weight:900;
}

.summary-card strong{
  display:block;
  margin-top:6px;
  font-size:24px;
}


/* SECTIONS */

.profile-section{
  margin-top:28px;
}

.profile-section h2{
  margin-bottom:14px;
  font-size:24px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat-card{
  padding:16px;

  border:1px solid #1d3551;
  border-radius:13px;

  background:
  linear-gradient(
    145deg,
    #07182c,
    #05070b
  );
}

.stat-card small{
  display:block;
  color:#8995a3;
  font-size:10px;
  font-weight:900;
}

.stat-card strong{
  display:block;
  margin-top:7px;
  font-size:21px;
}


/* INFO */

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.info-card{
  padding:15px;
  border:1px solid #1d3551;
  border-radius:12px;
  background:#071323;
}

.info-card small{
  display:block;
  color:#8995a3;
  font-size:10px;
  font-weight:900;
}

.info-card strong{
  display:block;
  margin-top:5px;
}


/* VERIFICATION */

.verify-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.verify-card{
  padding:15px;
  border-radius:12px;
  border:1px solid #1d3551;
  background:#071323;
}

.verify-card small{
  color:#8995a3;
  font-size:10px;
  font-weight:900;
}

.verify-card strong{
  display:block;
  margin-top:6px;
  color:#f0c45c;
}

.verify-card.ok strong{
  color:#44d47d;
}


/* NOT FOUND */

.not-found{
  text-align:center;
  padding:80px 20px;
  color:#9ea7b2;
}

.not-found h1{
  color:#fff;
  margin-bottom:10px;
}


/* RESPONSIVE */

@media(max-width:850px){

  .profile-hero{
    grid-template-columns:1fr;
    text-align:center;
  }

  .player-photo-large{
    margin:auto;
  }

  .profile-badges,
  .profile-actions{
    justify-content:center;
  }

  .summary-grid,
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .verify-box{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .summary-grid,
  .stats-grid,
  .info-grid{
    grid-template-columns:1fr;
  }

}

</style>

<style>

/* ==========================================
   PLAYER PROFILE
========================================== */

.profile-page{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
  padding:55px 0 90px;
}


/* ==========================================
   PROFILE HERO
========================================== */

.player-profile-hero{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:35px;
  align-items:center;

  padding:35px;

  border:1px solid #203b59;
  border-radius:22px;

  background:
    radial-gradient(
      circle at 12% 40%,
      rgba(20,75,130,.24),
      transparent 32%
    ),
    radial-gradient(
      circle at 88% 35%,
      rgba(239,27,27,.16),
      transparent 35%
    ),
    linear-gradient(
      110deg,
      rgba(7,26,52,.97),
      rgba(3,6,11,.98) 55%,
      rgba(27,5,8,.96)
    );
}


/* ==========================================
   LEFT PLAYER AVATAR
========================================== */

.profile-visual{
  text-align:center;
}


/* ROUND AVATAR */

.avatar-circle{
  width:205px;
  height:205px;

  margin:0 auto;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  overflow:hidden;

  border-radius:50%;

  border:3px solid #315a84;

  background:
    radial-gradient(
      circle at 50% 35%,
      #12375c 0%,
      #081b31 45%,
      #040a12 100%
    );

  box-shadow:
    0 0 25px rgba(40,105,170,.25),
    0 20px 45px rgba(0,0,0,.35);
}


/* DEFAULT AVATAR EMOJI */

.avatar-emoji{
  font-size:112px;
  line-height:1;

  transform:translateY(7px);

  filter:
    drop-shadow(
      0 8px 12px rgba(0,0,0,.28)
    );
}


/* REAL PLAYER PHOTO */

.avatar-photo{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}


/* ==========================================
   STAR RATING UNDER AVATAR
========================================== */

.avatar-rating{
  margin-top:16px;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:7px;

  white-space:nowrap;
}

.avatar-stars{
  font-size:21px;
  font-weight:1000;
  letter-spacing:1px;
}

.avatar-rating-number{
  color:#fff;

  font-size:14px;
  font-weight:1000;
}


/* RATING COLORS */

.rating-5,
.rating-45{
  color:#ffe14b;

  text-shadow:
    0 0 9px rgba(255,225,75,.28);
}

.rating-4,
.rating-35{
  color:#58dc78;

  text-shadow:
    0 0 8px rgba(88,220,120,.20);
}

.rating-3{
  color:#dce447;
}

.rating-25{
  color:#ff9f2e;
}

.rating-2,
.rating-15,
.rating-1{
  color:#ff4b4b;
}


/* ==========================================
   ROLE UNDER STARS
========================================== */

.avatar-role{
  margin-top:10px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  min-height:38px;

  padding:7px 14px;

  border:1px solid #294c70;
  border-radius:999px;

  background:#061323;

  color:#fff;

  font-size:11px;
  font-weight:1000;

  letter-spacing:.7px;
}

.role-symbol{
  font-size:21px;
  line-height:1;
}


/* ==========================================
   RIGHT PLAYER DETAILS
========================================== */

.profile-kicker{
  color:#ef1b1b;

  font-size:10px;
  font-weight:1000;

  letter-spacing:2px;
}

.profile-info h1{
  margin:7px 0;

  font-size:clamp(40px,5vw,62px);

  line-height:1;
}

.player-location{
  color:#98a4b1;

  font-size:13px;

  margin-top:8px;
}


/* BADGES */

.profile-badges{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:19px;
}

.profile-badge{
  display:inline-flex;
  align-items:center;

  padding:8px 12px;

  border-radius:999px;

  background:#071525;

  border:1px solid #294762;

  color:#fff;

  font-size:10px;
  font-weight:900;
}

.profile-badge.verified{
  color:#51db82;

  border-color:#256b43;
}


/* BUTTONS */

.profile-actions{
  display:flex;
  flex-wrap:wrap;

  gap:10px;

  margin-top:21px;
}

.profile-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:43px;

  padding:0 17px;

  border-radius:9px;

  background:#ef1b1b;

  color:#fff;

  font-size:10px;
  font-weight:1000;
}

.profile-btn.alt{
  background:#07182c;

  border:1px solid #31577e;
}


/* ==========================================
   SUMMARY CARDS
========================================== */

.profile-summary{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;

  margin-top:22px;
}

.summary-box{
  padding:18px;

  border:1px solid #203b59;
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(7,24,44,.96),
      rgba(5,7,11,.96) 65%,
      rgba(20,5,7,.96)
    );
}

.summary-box small{
  display:block;

  color:#8793a0;

  font-size:9px;
  font-weight:900;
}

.summary-box strong{
  display:block;

  margin-top:6px;

  font-size:24px;
}


/* ==========================================
   SECTIONS
========================================== */

.profile-section{
  margin-top:36px;
}

.section-title span{
  color:#ef1b1b;

  font-size:9px;
  font-weight:1000;

  letter-spacing:1.5px;
}

.section-title h2{
  margin-top:4px;
  margin-bottom:15px;

  font-size:26px;
}


/* ==========================================
   PLAYER INFORMATION
========================================== */

.info-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;
}

.info-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #07182c,
      #05070b
    );
}

.info-card small{
  display:block;

  color:#84909d;

  font-size:9px;
  font-weight:900;
}

.info-card strong{
  display:block;

  margin-top:7px;

  font-size:14px;
}


/* ==========================================
   STAT CARDS
========================================== */

.stats-grid{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:12px;
}

.stat-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(7,24,44,.96),
      rgba(5,7,11,.96)
    );
}

.stat-card small{
  display:block;

  color:#84909d;

  font-size:9px;
  font-weight:900;
}

.stat-card strong{
  display:block;

  margin-top:6px;

  font-size:22px;
}


/* ==========================================
   VERIFICATION
========================================== */

.verify-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.verify-card{
  padding:18px;

  border:1px solid #203850;
  border-radius:13px;

  background:#071323;
}

.verify-card small{
  display:block;

  color:#84909d;

  font-size:9px;
  font-weight:900;
}

.verify-card strong{
  display:block;

  margin-top:7px;

  color:#ffbd43;
}

.verify-card.success{
  border-color:#23613f;
}

.verify-card.success strong{
  color:#4bdb80;
}


/* ==========================================
   NOT FOUND
========================================== */

.not-found{
  padding:100px 20px;

  text-align:center;
}

.not-found p{
  margin:10px 0 20px;

  color:#929eaa;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:900px){

  .player-profile-hero{
    grid-template-columns:1fr;

    text-align:center;
  }

  .profile-badges,
  .profile-actions{
    justify-content:center;
  }

  .profile-summary{
    grid-template-columns:
      repeat(2,1fr);
  }

  .info-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .stats-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

}


@media(max-width:600px){

  .profile-page{
    width:calc(100% - 24px);

    padding-top:30px;
  }

  .player-profile-hero{
    padding:26px 18px;
  }

  .avatar-circle{
    width:185px;
    height:185px;
  }

  .avatar-emoji{
    font-size:102px;
  }

  .avatar-stars{
    font-size:19px;
  }

  .stats-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .verify-grid{
    grid-template-columns:1fr;
  }

}


@media(max-width:420px){

  .profile-summary,
  .info-grid,
  .stats-grid{
    grid-template-columns:1fr;
  }

}

</style>

/* ==========================================
   GET PLAYER
========================================== */

const params =
new URLSearchParams(
  window.location.search
);

let playerId =
Number(
  params.get("id")
);

if(!playerId){
  playerId = 1;
}

const player =
players.find(
  p => p.id === playerId
);


/* ==========================================
   STAR RATING
========================================== */

function getRating(score){

  if(score >= 90) return 5.0;

  if(score >= 80) return 4.5;

  if(score >= 70) return 4.0;

  if(score >= 60) return 3.5;

  if(score >= 50) return 3.0;

  if(score >= 40) return 2.5;

  if(score >= 30) return 2.0;

  if(score >= 20) return 1.5;

  return 1.0;
}


/* ==========================================
   STAR DISPLAY
========================================== */

function getStarText(rating){

  if(rating === 5)
    return "★★★★★";

  if(rating === 4.5)
    return "★★★★½";

  if(rating === 4)
    return "★★★★☆";

  if(rating === 3.5)
    return "★★★½☆";

  if(rating === 3)
    return "★★★☆☆";

  if(rating === 2.5)
    return "★★½☆☆";

  if(rating === 2)
    return "★★☆☆☆";

  if(rating === 1.5)
    return "★½☆☆☆";

  return "★☆☆☆☆";
}


/* ==========================================
   STAR COLOR
========================================== */

function getRatingClass(rating){

  if(rating === 5)
    return "rating-5";

  if(rating === 4.5)
    return "rating-45";

  if(rating === 4)
    return "rating-4";

  if(rating === 3.5)
    return "rating-35";

  if(rating === 3)
    return "rating-3";

  if(rating === 2.5)
    return "rating-25";

  if(rating === 2)
    return "rating-2";

  if(rating === 1.5)
    return "rating-15";

  return "rating-1";
}


/* ==========================================
   BASE POINTS
========================================== */

function getBasePoints(rating){

  if(rating >= 4.5)
    return 50;

  if(rating >= 3.5)
    return 25;

  return 10;
}


/* ==========================================
   AVATAR + ROLE SYMBOL
========================================== */

function getPlayerStyle(role){

  const value =
    role.toLowerCase();


  /* BATSMAN */

  if(
    value.includes("batsman") &&
    !value.includes("keeper")
  ){

    return{
      avatar:"👨‍🦱",
      symbol:"🏏",
      label:"BATSMAN"
    };

  }


  /* WICKET KEEPER */

  if(
    value.includes("wicket keeper") ||
    value.includes("keeper")
  ){

    return{
      avatar:"🧑",
      symbol:"🧤 🏏",
      label:"WICKET KEEPER"
    };

  }


  /* ALL ROUNDER */

  if(
    value.includes("all-rounder") ||
    value.includes("all rounder")
  ){

    return{
      avatar:"👨‍🦰",
      symbol:"🏏 🔴",
      label:"ALL-ROUNDER"
    };

  }


  /* SPIN BOWLER */

  if(
    value.includes("spin")
  ){

    return{
      avatar:"🧔",
      symbol:"🔴 🌀",
      label:"SPIN BOWLER"
    };

  }


  /* FAST BOWLER */

  if(
    value.includes("fast")
  ){

    return{
      avatar:"👨",
      symbol:"🔴 ⚡",
      label:"FAST BOWLER"
    };

  }


  /* MEDIUM PACER */

  if(
    value.includes("medium") ||
    value.includes("pacer")
  ){

    return{
      avatar:"🧑‍🦱",
      symbol:"🔴 🎯",
      label:"MEDIUM PACER"
    };

  }


  return{
    avatar:"👤",
    symbol:"🏏",
    label:"PLAYER"
  };

}


/* ==========================================
   VERIFICATION
========================================== */

function verificationClass(value){

  return value
    ? "verify-card success"
    : "verify-card";

}

function verificationText(value){

  return value
    ? "✓ VERIFIED"
    : "PENDING";

}

   RENDER
========================================== */

const page =
document.getElementById(
  "profilePage"
);

  page.innerHTML = `

        Player Not Found
      </h1>

      <p>
        This HCCL player profile is not available.
      </p>

        href="players.html">

        BACK TO MVP PLAYERS

      </a>

    </div>

  `;

    " — HCCL";

        ${player.name}

      </div>

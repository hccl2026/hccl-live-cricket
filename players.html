<style>

/* =====================================================
   PLAYER PROFILE PAGE
===================================================== */

.profile-page{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:55px 0 90px;
}


/* =====================================================
   HERO
===================================================== */

.player-hero{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:250px 1fr;
  gap:30px;
  align-items:center;

  padding:30px;

  border:1px solid #203b59;
  border-radius:22px;

  background:
    radial-gradient(
      circle at 88% 20%,
      rgba(239,27,27,.18),
      transparent 34%
    ),
    linear-gradient(
      120deg,
      #071b36 0%,
      #03070d 55%,
      #190508 100%
    );
}


/* =====================================================
   AVATAR
===================================================== */

.player-avatar-wrap{
  position:relative;
  z-index:2;

  width:220px;
  height:220px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:auto;

  border-radius:50%;

  overflow:hidden;

  border:3px solid #31577e;

  background:
    radial-gradient(
      circle,
      #0b2747 0%,
      #06101d 72%
    );

  box-shadow:
    0 15px 40px rgba(0,0,0,.45),
    0 0 35px rgba(18,74,127,.25);
}


/* REAL PHOTO */

.player-real-photo{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;
}


/* ROLE AVATAR */

.role-avatar{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  position:relative;
}

.role-main-icon{
  font-size:82px;
  line-height:1;
}

.role-secondary{
  margin-top:8px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  font-size:27px;
}

.role-label{
  margin-top:8px;

  color:#b7c3cf;

  font-size:9px;
  font-weight:1000;

  letter-spacing:1.5px;
}


/* ROLE BADGE */

.role-mini-badge{
  position:absolute;

  right:10px;
  bottom:10px;

  min-width:48px;
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:7px;

  border-radius:50%;

  background:#05090f;

  border:2px solid #ef1b1b;

  font-size:23px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.35);
}


/* =====================================================
   HERO DETAILS
===================================================== */

.player-info{
  position:relative;
  z-index:2;
}

.player-kicker{
  color:#ef1b1b;

  font-size:10px;
  font-weight:1000;
  letter-spacing:2px;
}

.player-info h1{
  margin:7px 0 6px;

  font-size:
    clamp(38px,5vw,58px);

  line-height:1;
}

.player-location{
  color:#98a4b0;

  margin-bottom:18px;

  font-size:13px;
}


/* BADGES */

.player-badges{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.player-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:8px 12px;

  border-radius:999px;

  border:1px solid #294563;

  background:#071323;

  color:#fff;

  font-size:10px;
  font-weight:1000;
}

.verified{
  color:#43d17c;
  border-color:#27794a;
}


/* =====================================================
   STAR RATING
===================================================== */

.player-rating-box{
  margin-top:17px;

  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.player-stars{
  font-size:25px;
  font-weight:1000;
  letter-spacing:2px;
}

.rating-number{
  font-size:16px;
  font-weight:1000;
  color:#fff;
}

.rating-5,
.rating-45{
  color:#ffe04a;
  text-shadow:
    0 0 8px rgba(255,224,74,.28);
}

.rating-4,
.rating-35{
  color:#55db75;
}

.rating-3{
  color:#d9e23f;
}

.rating-25{
  color:#ff9e2b;
}

.rating-2,
.rating-15,
.rating-1{
  color:#ff4b4b;
}


/* ACTIONS */

.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin-top:20px;
}

.profile-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:43px;

  padding:0 17px;

  border-radius:9px;

  background:#ef1b1b;

  color:#fff;

  font-size:11px;
  font-weight:1000;
}

.profile-button.secondary{
  background:#07182c;

  border:1px solid #31577e;
}


/* =====================================================
   SUMMARY
===================================================== */

.profile-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;

  margin-top:22px;
}

.summary-box{
  padding:18px;

  border:1px solid #203b59;
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #07182c,
      #05070b
    );
}

.summary-box small{
  display:block;

  color:#8794a2;

  font-size:9px;
  font-weight:900;
}

.summary-box strong{
  display:block;

  margin-top:6px;

  font-size:24px;
}


/* =====================================================
   SECTION
===================================================== */

.profile-section{
  margin-top:34px;
}

.section-heading{
  margin-bottom:14px;
}

.section-heading span{
  color:#ef1b1b;

  font-size:9px;
  font-weight:1000;

  letter-spacing:1.5px;
}

.section-heading h2{
  margin-top:4px;

  font-size:25px;
}


/* =====================================================
   INFO
===================================================== */

.info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.info-card{
  padding:16px;

  border:1px solid #203850;
  border-radius:12px;

  background:#071323;
}

.info-card small{
  display:block;

  color:#84909d;

  font-size:9px;
  font-weight:900;
}

.info-card strong{
  display:block;

  margin-top:6px;

  font-size:14px;
}


/* =====================================================
   STATS
===================================================== */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.stat-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #07182c,
      #05070b
    );
}

.stat-card small{
  display:block;

  color:#85919e;

  font-size:9px;
  font-weight:1000;
}

.stat-card strong{
  display:block;

  margin-top:6px;

  font-size:22px;
}


/* FIELDING */

.fielding-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}


/* VERIFICATION */

.verification-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.verification-card{
  padding:17px;

  border:1px solid #203850;
  border-radius:13px;

  background:#071323;
}

.verification-card small{
  display:block;

  color:#85919e;

  font-size:9px;
  font-weight:1000;
}

.verification-card strong{
  display:block;

  margin-top:7px;

  color:#ffca45;
}

.verification-card.success{
  border-color:#23613f;
}

.verification-card.success strong{
  color:#43d17c;
}


/* NOT FOUND */

.player-not-found{
  padding:90px 20px;

  text-align:center;
}

.player-not-found p{
  color:#8f9aa6;

  margin:10px 0 18px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  .player-hero{
    grid-template-columns:1fr;
    text-align:center;
  }

  .player-badges,
  .player-actions,
  .player-rating-box{
    justify-content:center;
  }

  .profile-summary{
    grid-template-columns:repeat(2,1fr);
  }

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .info-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .player-avatar-wrap{
    width:190px;
    height:190px;
  }

  .role-main-icon{
    font-size:70px;
  }

  .stats-grid,
  .fielding-grid,
  .verification-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:430px){

  .profile-summary,
  .stats-grid,
  .fielding-grid,
  .verification-grid,
  .info-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

   PLAYER ID
===================================================== */

new URLSearchParams(

players.find(
p => p.id === playerId

/* =====================================================
   RATING
===================================================== */

function getRating(score){

if(score >= 90){
return 5;
}

if(score >= 80){
return 4.5;
}

if(score >= 70){
return 4;
}

if(score >= 60){
return 3.5;
}

if(score >= 50){
return 3;
}

if(score >= 40){
return 2.5;
}

if(score >= 30){
return 2;
}

if(score >= 20){
return 1.5;
}

return 1;

}


function getStarText(rating){

const stars = {

5:"★★★★★",

4.5:"★★★★½",

4:"★★★★☆",

3.5:"★★★½☆",

3:"★★★☆☆",

2.5:"★★½☆☆",

2:"★★☆☆☆",

1.5:"★½☆☆☆",

1:"★☆☆☆☆"

};

return stars[rating];

}


function getRatingClass(rating){

if(rating === 5){
return "rating-5";
}

if(rating === 4.5){
return "rating-45";
}

if(rating === 4){
return "rating-4";
}

if(rating === 3.5){
return "rating-35";
}

if(rating === 3){
return "rating-3";
}

if(rating === 2.5){
return "rating-25";
}

if(rating === 2){
return "rating-2";
}

if(rating === 1.5){
return "rating-15";
}

return "rating-1";

}


function getBasePoints(rating){

if(rating >= 4.5){
return 50;
}

if(rating >= 3.5){
return 25;
}

return 10;

}



/* =====================================================
   ROLE AVATAR
===================================================== */

function getRoleAvatar(role){


if(role === "Batsman"){

return {

main:"🏏",

secondary:"",

label:"BATSMAN",

badge:"🏏"

};

}


if(
role === "Fast Bowler" ||
role === "Medium Pacer"
){

return {

main:"🔴",

secondary:"🎯",

label:"PACE BOWLER",

badge:"🔴"

};

}


if(role === "Spin Bowler"){

return {

main:"🔴",

secondary:"🌀",

label:"SPIN BOWLER",

badge:"🌀"

};

}


if(role === "All-Rounder"){

return {

main:"🏏",

secondary:"🔴",

label:"ALL-ROUNDER",

badge:"⚡"

};

}


if(role === "Wicket Keeper"){

return {

main:"🧤",

secondary:"🏏",

label:"WICKET KEEPER",

badge:"🧤"

};

}


if(role === "Wicket Keeper Batsman"){

return {

main:"🧤",

secondary:"🏏",

label:"KEEPER BATSMAN",

badge:"🏏"

};

}


return {

main:"👤",

secondary:"",

label:"PLAYER",

badge:"🏏"

};

}



/* =====================================================
   VERIFY HELPERS
===================================================== */

function verificationText(value){

return value
? "VERIFIED"

function verificationClass(value){

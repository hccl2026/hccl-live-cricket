<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCCL Live Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #06162d;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: #0b2345;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .logo-area h1 {
      font-size: 28px;
      letter-spacing: 1px;
    }

    .logo-area p {
      margin-top: 5px;
      opacity: 0.7;
      font-size: 14px;
    }

    .live-badge {
      background: #e11d48;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
    }

    .score-card {
      background: linear-gradient(135deg, #0d2d59, #071a34);
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .team.right {
      justify-content: flex-end;
      text-align: right;
    }

    .team-logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 3px solid rgba(255,255,255,0.3);
    }

    .team-name {
      font-size: 24px;
      font-weight: 700;
    }

    .team-sub {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .score-center {
      text-align: center;
      min-width: 260px;
    }

    .main-score {
      font-size: 58px;
      font-weight: 800;
    }

    .overs {
      font-size: 18px;
      margin-top: 5px;
      color: #b9d4ff;
    }

    .run-info {
      margin-top: 12px;
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 14px;
    }

    .dls-box {
      margin-top: 20px;
      background: #ffb703;
      color: #111827;
      padding: 15px 20px;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;
      font-weight: bold;
    }

    .dls-box.active {
      display: flex;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: #0b2345;
      border-radius: 20px;
      padding: 22px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #102d55;
      padding: 14px;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      object-fit: cover;
      background: #d8e3f1;
      border: 3px solid #3b82f6;
    }

    .player-info {
      flex: 1;
    }

    .player-info h3 {
      font-size: 17px;
    }

    .player-info p {
      margin-top: 5px;
      color: #abc3e8;
      font-size: 13px;
    }

    .player-score {
      font-size: 24px;
      font-weight: 700;
    }

    .controls {
      background: #0b2345;
      border-radius: 20px;
      padding: 22px;
    }

    .controls h2 {
      margin-bottom: 20px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 14px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .run-btn {
      background: #2563eb;
      color: #fff;
    }

    .four-btn {
      background: #16a34a;
      color: #fff;
    }

    .six-btn {
      background: #9333ea;
      color: #fff;
    }

    .wicket-btn {
      background: #dc2626;
      color: #fff;
    }

    .secondary-btn {
      background: #334155;
      color: #fff;
    }

    .dls-btn {
      background: #f59e0b;
      color: #111827;
    }

    .form-section {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #355276;
      background: #071a34;
      color: #fff;
      border-radius: 10px;
      outline: none;
    }

    .avatar-controls {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .avatar-upload {
      background: #102d55;
      padding: 15px;
      border-radius: 14px;
    }

    .avatar-upload label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .avatar-upload input {
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .teams-row,
      .section-grid {
        grid-template-columns: 1fr;
      }

      .score-center {
        order: 3;
      }

      .team.right {
        justify-content: flex-start;
        text-align: left;
      }

      .control-grid,
      .form-section,
      .avatar-controls {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo-area">
        <h1>HCCL 2006 SESSION 2</h1>
        <p>Live Cricket Scoring System</p>
      </div>

      <div class="live-badge">● LIVE</div>
    </div>


    <div class="score-card">

      <div class="teams-row">

        <div class="team">
          <img
            class="team-logo"
            id="teamALogo"
            src="https://via.placeholder.com/100"
            alt=""
          />

          <div>
            <div class="team-name" id="teamAName">TEAM A</div>
            <div class="team-sub">Batting</div>
          </div>
        </div>


        <div class="score-center">

          <div class="main-score">
            <span id="runs">0</span>/<span id="wickets">0</span>
          </div>

          <div class="overs">
            <span id="overs">0.0</span> Overs
          </div>

          <div class="run-info">
            <span>
              CRR:
              <strong id="crr">0.00</strong>
            </span>

            <span>
              RRR:
              <strong id="rrr">0.00</strong>
            </span>
          </div>

        </div>


        <div class="team right">

          <div>
            <div class="team-name" id="teamBName">TEAM B</div>
            <div class="team-sub">Bowling</div>
          </div>

          <img
            class="team-logo"
            id="teamBLogo"
            src="https://via.placeholder.com/100"
            alt=""
          />

        </div>

      </div>


      <div class="dls-box" id="dlsBox">

        <span>
          DLS TARGET:
          <strong id="dlsTarget">-</strong>
        </span>

        <span>
          PAR SCORE:
          <strong id="dlsParScore">-</strong>
        </span>

        <span>
          REVISED OVERS:
          <strong id="revisedOvers">-</strong>
        </span>

      </div>

    </div>



    <div class="section-grid">

      <div class="panel">

        <h2>Batting</h2>


        <div class="player-card">

          <img
            id="strikerAvatar"
            class="avatar"
            src="https://via.placeholder.com/100"
          />

          <div class="player-info">
            <h3 id="strikerName">Striker *</h3>
            <p>
              Balls:
              <span id="strikerBalls">0</span>
            </p>
          </div>

          <div class="player-score">
            <span id="strikerRuns">0</span>
          </div>

        </div>



        <div class="player-card">

          <img
            id="nonStrikerAvatar"
            class="avatar"
            src="https://via.placeholder.com/100"
          />

          <div class="player-info">
            <h3 id="nonStrikerName">Non-Striker</h3>
            <p>
              Balls:
              <span id="nonStrikerBalls">0</span>
            </p>
          </div>

          <div class="player-score">
            <span id="nonStrikerRuns">0</span>
          </div>

        </div>

      </div>



      <div class="panel">

        <h2>Bowling</h2>

        <div class="player-card">

          <img
            id="bowlerAvatar"
            class="avatar"
            src="https://via.placeholder.com/100"
          />

          <div class="player-info">
            <h3 id="bowlerName">Bowler</h3>

            <p>
              Overs:
              <span id="bowlerOvers">0.0</span>

              &nbsp; | &nbsp;

              Wickets:
              <span id="bowlerWickets">0</span>
            </p>
          </div>

        </div>

      </div>

    </div>



    <div class="controls">

      <h2>Scoring Controls</h2>

      <div class="control-grid">

        <button class="run-btn" onclick="addRuns(1)">+1 RUN</button>
        <button class="run-btn" onclick="addRuns(2)">+2 RUN</button>
        <button class="run-btn" onclick="addRuns(3)">+3 RUN</button>

        <button class="four-btn" onclick="addRuns(4)">FOUR</button>

        <button class="six-btn" onclick="addRuns(6)">SIX</button>

        <button class="wicket-btn" onclick="addWicket()">
          WICKET
        </button>

        <button class="secondary-btn" onclick="addWide()">
          WIDE
        </button>

        <button class="secondary-btn" onclick="addNoBall()">
          NO BALL
        </button>

      </div>



      <div class="form-section">

        <input
          type="number"
          id="dlsTargetInput"
          placeholder="DLS Target"
        />

        <input
          type="number"
          id="parScoreInput"
          placeholder="Par Score"
        />

        <input
          type="number"
          step="0.1"
          id="revisedOversInput"
          placeholder="Revised Overs"
        />

        <button
          class="dls-btn"
          onclick="updateDLS()"
        >
          UPDATE DLS
        </button>

      </div>


      <div class="avatar-controls">

        <div class="avatar-upload">

          <label>Striker Avatar</label>

          <input
            type="file"
            accept="image/*"
            onchange="changeAvatar(event,'strikerAvatar','strikerAvatarData')"
          />

        </div>


        <div class="avatar-upload">

          <label>Non-Striker Avatar</label>

          <input
            type="file"
            accept="image/*"
            onchange="changeAvatar(event,'nonStrikerAvatar','nonStrikerAvatarData')"
          />

        </div>


        <div class="avatar-upload">

          <label>Bowler Avatar</label>

          <input
            type="file"
            accept="image/*"
            onchange="changeAvatar(event,'bowlerAvatar','bowlerAvatarData')"
          />

        </div>

      </div>


      <div style="margin-top:20px;">

        <button
          class="secondary-btn"
          onclick="resetMatch()"
        >
          RESET MATCH
        </button>

      </div>

    </div>

  </div>


<script>

let match = JSON.parse(localStorage.getItem("hcclMatch")) || {

  runs: 0,

  wickets: 0,

  balls: 0,

  strikerRuns: 0,

  strikerBalls: 0,

  nonStrikerRuns: 0,

  nonStrikerBalls: 0,

  bowlerWickets: 0,

  dlsTarget: null,

  parScore: null,

  revisedOvers: null

};


function saveMatch(){

  localStorage.setItem(
    "hcclMatch",
    JSON.stringify(match)
  );

}


function calculateOvers(){

  const completedOvers =
    Math.floor(match.balls / 6);

  const remainingBalls =
    match.balls % 6;

  return completedOvers + "." + remainingBalls;

}


function calculateCRR(){

  if(match.balls === 0){
    return "0.00";
  }

  return (
    match.runs /
    (match.balls / 6)
  ).toFixed(2);

}


function calculateRRR(){

  if(
    !match.dlsTarget ||
    !match.revisedOvers
  ){
    return "0.00";
  }

  const totalBalls =
    Math.round(match.revisedOvers * 6);

  const ballsLeft =
    totalBalls - match.balls;

  const runsNeeded =
    match.dlsTarget - match.runs;

  if(
    ballsLeft <= 0 ||
    runsNeeded <= 0
  ){
    return "0.00";
  }

  return (
    runsNeeded /
    (ballsLeft / 6)
  ).toFixed(2);

}



function render(){

  document.getElementById("runs").textContent =
    match.runs;

  document.getElementById("wickets").textContent =
    match.wickets;

  document.getElementById("overs").textContent =
    calculateOvers();

  document.getElementById("bowlerOvers").textContent =
    calculateOvers();

  document.getElementById("crr").textContent =
    calculateCRR();

  document.getElementById("rrr").textContent =
    calculateRRR();


  document.getElementById("strikerRuns").textContent =
    match.strikerRuns;

  document.getElementById("strikerBalls").textContent =
    match.strikerBalls;


  document.getElementById("nonStrikerRuns").textContent =
    match.nonStrikerRuns;

  document.getElementById("nonStrikerBalls").textContent =
    match.nonStrikerBalls;


  document.getElementById("bowlerWickets").textContent =
    match.bowlerWickets;



  if(match.dlsTarget){

    document
      .getElementById("dlsBox")
      .classList.add("active");


    document.getElementById("dlsTarget").textContent =
      match.dlsTarget;


    document.getElementById("dlsParScore").textContent =
      match.parScore || "-";


    document.getElementById("revisedOvers").textContent =
      match.revisedOvers
        ? match.revisedOvers + " Overs"
        : "-";

  }else{

    document
      .getElementById("dlsBox")
      .classList.remove("active");

  }


  saveMatch();

}



function addRuns(runs){

  match.runs += runs;

  match.strikerRuns += runs;

  match.strikerBalls++;

  match.balls++;


  if(
    runs === 1 ||
    runs === 3
  ){

    swapStrike();

  }


  if(match.balls % 6 === 0){

    swapStrike();

  }


  render();

}



function addWicket(){

  if(match.wickets >= 10){
    return;
  }

  match.wickets++;

  match.strikerBalls++;

  match.balls++;

  match.bowlerWickets++;

  match.strikerRuns = 0;

  match.strikerBalls = 0;

  render();

}



function addWide(){

  match.runs++;

  render();

}



function addNoBall(){

  match.runs++;

  render();

}



function swapStrike(){

  const tempRuns =
    match.strikerRuns;

  const tempBalls =
    match.strikerBalls;


  match.strikerRuns =
    match.nonStrikerRuns;

  match.strikerBalls =
    match.nonStrikerBalls;


  match.nonStrikerRuns =
    tempRuns;

  match.nonStrikerBalls =
    tempBalls;

}



function updateDLS(){

  const target =
    Number(
      document.getElementById("dlsTargetInput").value
    );

  const parScore =
    Number(
      document.getElementById("parScoreInput").value
    );

  const revisedOvers =
    Number(
      document.getElementById("revisedOversInput").value
    );


  if(!target){

    alert("Enter DLS Target");

    return;

  }


  match.dlsTarget =
    target;

  match.parScore =
    parScore || null;

  match.revisedOvers =
    revisedOvers || null;


  render();

}



function changeAvatar(
  event,
  elementId,
  storageKey
){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      const imageData =
        e.target.result;


      document
        .getElementById(elementId)
        .src =
        imageData;


      localStorage.setItem(
        storageKey,
        imageData
      );

    };


  reader.readAsDataURL(file);

}



function loadAvatars(){

  const striker =
    localStorage.getItem(
      "strikerAvatarData"
    );

  const nonStriker =
    localStorage.getItem(
      "nonStrikerAvatarData"
    );

  const bowler =
    localStorage.getItem(
      "bowlerAvatarData"
    );


  if(striker){

    document.getElementById(
      "strikerAvatar"
    ).src = striker;

  }


  if(nonStriker){

    document.getElementById(
      "nonStrikerAvatar"
    ).src = nonStriker;

  }


  if(bowler){

    document.getElementById(
      "bowlerAvatar"
    ).src = bowler;

  }

}



function resetMatch(){

  const confirmReset =
    confirm(
      "Are you sure you want to reset the match?"
    );

  if(!confirmReset){
    return;
  }


  localStorage.removeItem(
    "hcclMatch"
  );


  match = {

    runs:0,

    wickets:0,

    balls:0,

    strikerRuns:0,

    strikerBalls:0,

    nonStrikerRuns:0,

    nonStrikerBalls:0,

    bowlerWickets:0,

    dlsTarget:null,

    parScore:null,

    revisedOvers:null

  };


  render();

}



loadAvatars();

render();

</script>

</body>
</html>
